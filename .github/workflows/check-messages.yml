name: Check SOM Messages

on:
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser (only if cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Install OS deps (always, lightweight)
        run: npx playwright install-deps firefox

      - name: Run check script
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node check-messages.js

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baseline.json package-lock.json
          git diff --staged --quiet || git commit -m "update baseline / lockfile [skip ci]"
          git push
          
      - name: Notify on failure
        if: failure()
        env:
          ALERT_NTFY_TOPIC: ${{ secrets.ALERT_NTFY_TOPIC }}
        run: |
          curl -H "Title: 도영이 메시지가 안왕 🐰" \
               -H "Priority: high" \
               -d "궁빵이 빵배달 상태 점검 필요" \
               https://ntfy.sh/$ALERT_NTFY_TOPIC
